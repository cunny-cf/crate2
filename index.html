<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webhook Drive</title>
<style>
:root{--side:#131314;--bg:#1b1b1c;--ink:#e3e3e3;--mute:#c4c7c5;--dim:#9aa0a6;--line:#2f3033;--acc:#a8c7fa;--accbg:#004a77;--accfg:#c2e7ff;--hov:#ffffff12;--sel:#1c3a5e;--field:#282a2c;--bad:#f28b82;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--side);color:var(--ink);font:14px/1.45 "Google Sans",Roboto,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input[type=text],input[type=password],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:inherit}
label{display:block;font-size:.8rem;color:var(--dim);margin:10px 0 3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{padding:9px 20px;border-radius:20px;border:1px solid #8e918f;background:none;color:var(--acc)}.btn:hover{background:var(--hov)}.btn.p{background:var(--acc);border-color:var(--acc);color:#062e6f}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
small{color:var(--dim)}
header{display:flex;align-items:center;gap:8px;padding:8px 16px;position:sticky;top:0;background:var(--side);z-index:5;height:64px}
.brand{display:flex;align-items:center;gap:10px;width:232px;font-size:1.3rem;color:var(--mute);white-space:nowrap}.lg{width:40px;height:36px}
.search{flex:1;max-width:720px;display:flex;align-items:center;gap:12px;background:var(--field);border-radius:24px;padding:0 16px;height:48px;color:var(--mute)}.search:focus-within{background:#303134}
.search input{border:0;background:transparent;color:var(--ink);font:inherit;width:100%;outline:0;height:100%}
.sp{flex:1}
.ib{border:0;background:none;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;color:var(--mute);font-size:1.2rem}.ib:hover{background:var(--hov)}
.av{width:32px;height:32px;border-radius:50%;border:0;background:#7c4dff;color:#fff;font-weight:600;margin-left:6px}
.i{width:24px;height:24px;fill:currentColor;flex:none}.i.big{width:56px;height:56px}
.wrap{display:flex;padding:0 16px 16px 0}
nav{width:256px;flex:none;padding:4px 12px 8px;display:flex;flex-direction:column;gap:2px}
.new{display:flex;gap:12px;align-items:center;align-self:flex-start;margin:4px 0 16px;padding:16px 24px 16px 16px;border:0;border-radius:16px;background:var(--field);box-shadow:0 1px 3px #0006;font-weight:500;font-size:.95rem}.new:hover{background:#303134}.new .i{color:var(--acc)}
.nv{display:flex;gap:14px;align-items:center;padding:0 16px;height:40px;border-radius:20px;color:var(--ink);text-decoration:none;background:none;border:0;text-align:left}.nv:hover{background:var(--hov)}.nv.on{background:var(--accbg);color:var(--accfg)}
.stor{margin-top:16px;padding:16px;color:var(--dim);border-top:1px solid var(--line)}
main{flex:1;min-width:0;background:var(--bg);border-radius:16px;padding:8px 16px 90px;min-height:calc(100vh - 80px)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:8px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:1.3rem;min-width:0}
.crumbs a,.crumbs b{color:var(--ink);text-decoration:none;padding:4px 10px;border-radius:18px;font-weight:400}.crumbs a:hover{background:var(--hov)}.crumbs span{color:var(--dim)}
#sb{display:flex;align-items:center;gap:4px;background:var(--accbg);color:var(--accfg);border-radius:24px;padding:4px 8px;min-width:0;overflow-x:auto}#sb button{border:0;background:none;padding:8px 12px;border-radius:18px;white-space:nowrap}#sb button:hover{background:#ffffff1f}#sbn{padding:0 10px;white-space:nowrap}
.head,.r{display:grid;grid-template-columns:minmax(0,1fr) 190px 100px 40px;align-items:center;gap:8px;padding:0 12px}
.head{height:44px;border-bottom:1px solid var(--line)}.head button{border:0;background:none;color:var(--mute);font-weight:500;text-align:left;padding:0}.head button:hover{color:var(--ink)}
.r{min-height:52px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}.r:hover{background:var(--hov)}.r.on{background:var(--sel)}
.nm{display:flex;align-items:center;gap:16px;min-width:0}
.t{display:flex;flex-direction:column;min-width:0}.t b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:none;color:var(--dim);font-size:.75rem}.mu{color:var(--mute);font-size:.85rem}
.more{border:0;background:none;color:var(--mute);border-radius:50%;width:36px;height:36px;font-size:1.3rem}.more:hover{background:#ffffff1f}
#list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding-top:8px}
.c{background:var(--field);border-radius:12px;cursor:pointer;user-select:none;border:2px solid transparent;overflow:hidden}.c:hover{background:#303134}.c.on{background:var(--sel);border-color:var(--acc)}
.cv{height:130px;display:grid;place-items:center;background:#1e1f20}.c.on .cv{background:#16314f}
.cn{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 12px}.cn b{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:64px 0;text-align:center;color:var(--dim);grid-column:1/-1}
.fab{display:none;position:fixed;right:18px;bottom:18px;width:56px;height:56px;border:0;border-radius:16px;background:var(--accbg);color:var(--accfg);box-shadow:0 2px 8px #0008;place-items:center;z-index:6}
#menu{position:fixed;z-index:20;background:#2b2c2e;border-radius:8px;box-shadow:0 4px 16px #000a;min-width:200px;padding:8px 0}
#menu button{display:block;width:100%;text-align:left;padding:10px 16px;border:0;background:none}#menu button:hover{background:var(--hov)}#menu .del{color:var(--bad)}
dialog{background:#2b2c2e;color:var(--ink);border:0;border-radius:24px;width:min(560px,94vw);padding:20px;max-height:90vh}
dialog::backdrop{background:#000a}
dialog h2{font-size:1.1rem;margin:14px 0 4px;font-weight:500}
#mvl{max-height:50vh;overflow:auto;margin-top:8px}#mvl button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:8px;background:none}#mvl button:hover{background:var(--hov)}
#log{font:.78rem/1.4 ui-monospace,monospace;white-space:pre-wrap;max-height:180px;overflow:auto;color:var(--dim)}#log .bad{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#e3e3e3;color:#1f1f1f;padding:12px 18px;border-radius:6px;z-index:60;max-width:92vw;word-break:break-word}
#drop{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#a8c7fa22;border:3px dashed var(--acc);font-size:1.3rem;pointer-events:none}
#pvd{width:min(900px,96vw)}#pvb img,#pvb video{max-width:100%;max-height:70vh;display:block;margin:10px auto}#pvb audio{width:100%;margin-top:10px}
progress#bar{position:fixed;top:0;left:0;width:100%;height:3px;margin:0;z-index:50}
#login{max-width:380px;margin:12vh auto 0;background:var(--bg);border-radius:24px;padding:28px}
#login h1{font-size:1.5rem;margin:0 0 4px;font-weight:400}
@media(max-width:720px){nav,.head{display:none}.r{grid-template-columns:minmax(0,1fr) 40px}.r .mu{display:none}.sub{display:block}.fab{display:grid}.brand{width:auto}.brand span{display:none}main{border-radius:12px;margin:0 8px}.wrap{padding:0 0 8px}#list.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.meter{height:4px;background:#444746;border-radius:2px;margin:0 0 8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--acc)}
.st{color:#fdd663;margin:0 4px}
.cv{position:relative;overflow:hidden}.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}.cv img.ok{opacity:1}
#wb{position:fixed;top:0;left:0;right:0;z-index:70;background:#b3261e;color:#fff;padding:10px 16px;text-align:center}#wb a{color:#fff;font-weight:600;margin-left:6px;text-decoration:underline}
</style>
</head>
<body>
<div id="login">
<h1>Webhook Drive</h1><small>Sign in to your drive</small>
<label for="ln">Username</label><input type="text" id="ln" autocomplete="username">
<label for="lp">Password</label><input type="password" id="lp" autocomplete="current-password">
<div class="row"><button class="btn p" id="go">Sign in</button><button class="btn" id="ls">Server settings</button></div>
<p><small>Test account: admin / admin</small></p>
</div>

<div id="app" hidden>
<header>
<div class="brand"><svg class="lg" viewBox="0 0 40 36" aria-hidden="true"><path fill="#fbbc04" d="M14 1h12l14 24H28z"/><path fill="#34a853" d="M14 1L0 25l6 10 14-24z"/><path fill="#4285f4" d="M6 35h28l6-10H12z"/></svg><span>Webhook Drive</span></div>
<label class="search"><svg class="i" viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg><input id="q" type="search" placeholder="Search in Drive" aria-label="Search"></label>
<span class="sp"></span>
<button class="ib" id="rf" title="Sync" aria-label="Sync"><svg class="i" viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
<button class="ib" id="gear" title="Settings" aria-label="Settings">⚙</button>
<button class="av" id="av" aria-label="Account"></button>
</header>
<div class="wrap">
<nav>
<button class="new" id="new"><svg class="i" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>New</button>
<a class="nv on" data-v="d" href="#/"><svg class="i" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm0 12H4V8h16v10z"/></svg>My Drive</a>
<a class="nv" data-v="r" href="#/~recent"><svg class="i" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>Recent</a>
<a class="nv" data-v="s" href="#/~starred"><svg class="i" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>Starred</a>
<a class="nv" data-v="t" href="#/~trash"><svg class="i" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Trash</a>
<button class="nv" id="st"><svg class="i" viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A6 6 0 0 0 6 20h13a5 5 0 0 0 .35-9.96z"/></svg>Settings</button>
<div class="stor" id="stor"></div>
</nav>
<main>
<div class="bar"><div class="crumbs" id="crumbs"></div>
<div id="sb" hidden><button data-a="clr" aria-label="Clear selection">✕</button><span id="sbn"></span><span id="sbb"></span></div>
<button class="btn" id="et" hidden>Empty trash</button><button class="ib" id="vt" aria-label="Switch layout"></button></div>
<div class="head" id="head"><button data-s="name">Name</button><button data-s="mod">Modified</button><button data-s="size">Size</button><span></span></div>
<div id="list"></div>
</main>
</div>
<button class="fab" id="fab" aria-label="New"><svg class="i" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
</div>

<progress id="bar" value="0" max="1" hidden></progress>
<input type="file" id="pick" multiple hidden>
<div id="menu" hidden></div>
<div id="toast" hidden></div>
<div id="drop" hidden>Drop files to upload</div>

<dialog id="mvd"><b>Move to</b><div id="mvl"></div><div class="row"><button class="btn" onclick="this.closest('dialog').close()">Cancel</button></div></dialog>

<dialog id="pvd"><div class="row" style="justify-content:space-between;margin:0"><b id="pvt"></b><button class="btn" onclick="this.closest('dialog').close()">Close</button></div><div id="pvb"></div></dialog>

<dialog id="set">
<div class="top row" style="justify-content:space-between;margin:0"><b id="who"></b><small id="role"></small></div>
<h2>Server</h2>
<label for="px">Worker address, e.g. https://your-worker.workers.dev</label><input type="text" id="px" autocomplete="off">
<label for="sk">Setup key (only for creating the first admin)</label><input type="password" id="sk" autocomplete="off">
<label for="dm">Download mode</label><select id="dm"><option value="auto">Auto: folder mode on desktop Chrome, proxy elsewhere</option><option value="worker">Always use the proxy</option></select>
<div class="row"><button class="btn" id="chk">Check Worker</button><button class="btn" id="mk1">Create first admin</button></div>
<div id="conn" hidden>
<h2>Connection</h2>
<label for="mh">Metadata webhook</label><input type="password" id="mh" autocomplete="off">
<label for="dh">Data webhook</label><input type="password" id="dh" autocomplete="off">
<div class="row"><button class="btn" id="prov">Rotate webhooks</button><button class="btn" id="test">Test</button><button class="btn" id="stt">Upload self-test</button></div>
</div>
<div id="users" hidden>
<h2>Users</h2>
<div id="ulist"></div>
<label for="nn">New username</label><input type="text" id="nn" autocomplete="off">
<label for="np">Password</label><input type="password" id="np" autocomplete="new-password">
<label for="nr">Role</label><select id="nr"><option>user</option><option>admin</option></select>
<div class="row"><button class="btn p" id="add">Create user</button></div>
</div>
<h2>Log</h2><div id="log"></div>
<div class="row"><button class="btn" id="out">Sign out</button><button class="btn" onclick="this.closest('dialog').close()">Close</button></div>
</dialog>

<div id="wb" hidden></div>
<script>
const $=s=>document.querySelector(s);
const CH=19*1024*1024,BATCH=4,GAP=5000,J={'Content-Type':'application/json'};
const D=Object.assign({proxy:'',bot:'',guild:'1561537402894426174',accts:{},session:'',files:{}},JSON.parse(localStorage.dd||'{}'));
const save=()=>localStorage.dd=JSON.stringify(D);
let A=null,cur='';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n>=1e12?(n/1e12).toFixed(2)+' TB':n>=1e9?(n/1e9).toFixed(2)+' GB':n>=1e6?(n/1e6).toFixed(1)+' MB':Math.ceil(n/1e3)+' KB';
const dt=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return p(d.getMonth()+1)+'/'+p(d.getDate())+'/'+String(d.getFullYear()).slice(2)+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())};
function log(m,bad){const d=document.createElement('div');if(bad)d.className='bad';d.textContent=m;$('#log').prepend(d);if(bad||/^(Saved|Deleted|Downloaded|Created)/.test(m))toast(m)}
function progress(v){const b=$('#bar');b.hidden=false;b.value=v;if(v>=1)setTimeout(()=>b.hidden=true,800)}
async function hp(uuid,p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(uuid+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const L=()=>(D.files[A.uuid]??={list:[],last:''});

// Discord calls: webhook (hf) and bot (bot), both retry on rate limits
const wrapU=u=>{const p=(D.proxy||'').trim();return/[?=]$/.test(p)?p+encodeURIComponent(u):p.replace(/\/?$/,'/')+u};
async function hf(hook,path,opt={}){
  for(let t=0;t<5;t++){
    let r;const m=opt.method||'GET',px=(D.proxy||'').trim();
    try{r=await fetch(px&&m!=='GET'?wrapU(hook+path):hook+path,opt)}
    catch(e){
      if(px&&m==='GET'){try{r=await fetch(wrapU(hook+path),opt)}catch{}}
      if(!r)throw new Error('Request never reached Discord (browser blocked it or no network): '+m+' webhook'+path);
    }
    if(r.status===429){const j=await r.json().catch(()=>({}));await sleep((j.retry_after||1)*1000+200);continue}
    if(!r.ok){const tx=await r.text();if(r.status===404&&/10015/.test(tx))hookGone(hook);throw new Error(r.status+' '+tx)}
    return r.status===204?null:r.json();
  }
  throw new Error('Rate limited too many times');
}
function botRoute(){if(location.hash!=='#/bot/update')return;history.replaceState(null,'',location.pathname+location.search+'#/');if(A)sync(false).catch(e=>log(e.message,1))}
// Worker API: it holds the bot token and server ID. The page calls it for sign-in, new users, listing, rotation and link refresh only.
function setApi(v){v=(v||'').trim().replace(/(\/?\?url=)?\/*$/,'');D.api=v;D.proxy=v?v+'/?url=':''}
async function api(path,body){
  if(!D.api)throw new Error('Set the Worker address under Settings first.');
  let r;
  try{r=await fetch(D.api+path,{method:'POST',headers:J,body:JSON.stringify({t:A?.token,...body})})}
  catch{throw new Error('Could not reach the Worker (wrong address, or it is down).')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Worker error '+r.status);
  return j;
}
const hookUrl=p=>'https://discord.com/api/webhooks/'+p;
async function login(){
  const name=$('#ln').value.trim().toLowerCase();
  const j=await api('/login',{name,password:$('#lp').value});
  const a={uuid:j.user.uuid,name,role:j.user.role,token:j.token,used:j.used,smid:j.smid,meta:{chan:j.meta.chan,hook:hookUrl(j.meta.path)},data:{chan:j.data.chan,hook:hookUrl(j.data.path)}};
  D.accts[name]=a;D.session=name;A=a;save();$('#lp').value='';view();
}
async function addUser(){
  const name=$('#nn').value.trim().toLowerCase(),pw=$('#np').value;
  if(!/^[a-z0-9_-]{2,20}$/.test(name)||!pw)throw new Error('Username: 2-20 letters, numbers, - or _. Password is required.');
  await api('/admin/user',{name,password:pw,role:$('#nr').value});
  $('#nn').value=$('#np').value='';log('Created '+name+'. They can sign in now.');
}
async function firstAdmin(){
  const name=$('#ln').value.trim().toLowerCase(),pw=$('#lp').value,sk=$('#sk').value;
  if(!sk)throw new Error('Enter the setup key first.');
  await api('/admin/user',{name,password:pw,role:'admin',setup:sk});
  log('Created admin '+name+'. You can sign in now.');
}
async function checkWorker(){
  if(!D.api)throw new Error('Set the Worker address first.');
  log((await(await fetch(D.api+'/ping')).json()).ok?'Worker reachable':'Unexpected reply from the Worker');
}
// a webhook Discord calls gone is re-checked three times (slow is not missing); nothing changes by itself
const gone={};
async function hookGone(hook){
  const kind=hook===A?.meta?.hook?'meta':hook===A?.data?.hook?'data':null;
  if(!kind||gone[kind])return;gone[kind]='checking';
  for(let i=0;i<3;i++){
    await sleep(4000);
    try{const r=await fetch(D.proxy?wrapU(hook):hook);if(r.status!==404){gone[kind]=0;return}}catch{gone[kind]=0;return}
  }
  gone[kind]=1;banner(kind);
}
function banner(kind){
  const b=$('#wb');
  b.innerHTML='Webhook missing ('+kind+'), please rotate to a new one <a href="#" id="wr">here</a>';
  b.hidden=false;
  $('#wr').onclick=e=>{e.preventDefault();rotate(kind).catch(x=>log(x.message,1))};
}
async function rotate(kind){
  for(const k of kind==='both'?['meta','data']:[kind]){
    const j=await api('/rotate',{ch:k});
    A[k].hook=hookUrl(j.path);gone[k]=0;
    if(k==='meta'&&j.smid)A.smid=j.smid;
  }
  save();view();
  if(!gone.meta&&!gone.data)$('#wb').hidden=true;
  log('Webhook rotated');
}
// delete one message: the webhook for its own messages, the Worker's bot for ones an older webhook posted
async function delMsg(ch,hook,id){
  try{await hf(hook,'/messages/'+id,{method:'DELETE'})}
  catch(e){if(!/^(404|403)/.test(e.message)||!A.token)throw e;await api('/del',{ch,id}).catch(()=>{})}
}

// per-file metadata: one small message per file in the metadata channel
// small records are one text message; once over 2000 chars (or already big) the chunk list lives in <id>.json
function pack(f){
  const{mid,...r}=f;
  const s=JSON.stringify({t:'f',...r});
  if(!f.big&&s.length<=2000)return{s,file:null};
  f.big=1;
  const{chunks,...rest}=r;
  return{s:JSON.stringify({t:'f',...rest,big:1}),file:new Blob([JSON.stringify(chunks)],{type:'application/json'})};
}
async function getChunks(f){
  if(f.chunks)return f.chunks;
  const m=await metaOf(f.mid),r=await cdn((m.attachments.find(a=>/\.json$/.test(a.filename))||m.attachments[0]).url);
  await bad(r);
  f.chunks=await r.json();save();return f.chunks;
}
async function editMeta(f){
  try{await editMeta0(f)}
  catch(e){if(!/^(404|403)/.test(e.message)||!A.token)throw e;await repost(f);save();render()} // the old webhook posted it: copy to a new message, delete the old one
}
async function repost(f){

// self-test: pushes small files of different types through the real upload path, reads them back from Discord, compares bytes
async function selfTest(){
  const cv=(w,h,fmt,q)=>new Promise(r=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#4285f4';x.fillRect(0,0,w,h);x.fillStyle='#fbbc04';x.fillRect(0,0,w/2,h/2);c.toBlob(r,fmt,q)});
  const rnd=n=>{const a=new Uint8Array(n);for(let i=0;i<n;i+=65536)crypto.getRandomValues(a.subarray(i,Math.min(n,i+65536)));return a};
  const cases=[
    ['1 byte text','t.txt','text/plain',new Uint8Array([120])],
    ['1x1 PNG','a.png','image/png',await cv(1,1,'image/png')],
    ['64x64 PNG','b.png','image/png',await cv(64,64,'image/png')],
    ['64x64 JPEG','c.jpg','image/jpeg',await cv(64,64,'image/jpeg',.8)],
    ['64x64 WebP','d.webp','image/webp',await cv(64,64,'image/webp',.8)],
    ['1 MB random .bin','e.bin','application/octet-stream',rnd(1<<20)],
    ['1 MB random named .png','f.png','image/png',rnd(1<<20)]

  let ok=0;
  for(const[label,name,type,data]of cases){
    const f=new File([data],name,{type});let step='upload';
    try{
      await upload(f);
      const rec=L().list[L().list.length-1];
      step='reading back';
      const parts=[];let tot=0;
      for(const mid of await getChunks(rec)){const r=await cdn((await msgOf(mid)).attachments[0].url);const b=new Uint8Array(await r.arrayBuffer());parts.push(b);tot+=b.length}
      const orig=new Uint8Array(await f.arrayBuffer());
      if(tot!==orig.length)throw new Error('size mismatch: sent '+orig.length+', got '+tot);
      let o=0;for(const b of parts){for(let i=0;i<b.length;i++)if(b[i]!==orig[o+i])throw new Error('content mismatch at byte '+(o+i));o+=b.length}
      step='cleanup';await remove(rec);

    }catch(e){log('FAIL  '+label+' at '+step+': '+e.message,1)}

}

  $('#vt').innerHTML=SVG(D.grid?'M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z':'M3 3v8h8V3H3zm6 6H5V5h4v4zm-6 4v8h8v-8H3zm6 6H5v-4h4v4zm4-16v8h8V3h-8zm6 6h-4V5h4v4zm-6 4v8h8v-8h-8zm6 6h-4v-4h4v4z');
  $('#sb').hidden=!sel.size;$('#crumbs').hidden=!!sel.size;$('#et').hidden=!(tr&&!sel.size&&items.length);

  $('#sbb').innerHTML=tr?'<button data-a="rest">Restore</button><button data-a="del">Delete forever</button>':'<button data-a="dl">Download</button>'+(sel.size===1?'<button data-a="ren">Rename</button>':'')+'<button data-a="mv">Move</button><button data-a="star">Star</button><button data-a="trash">Move to trash</button>';

// folders are stored as small {t:'d',path} messages so they exist while empty and sync across devices
async function mkdir(path){
  if(paths().includes(path))return;
  const m=await put(A.meta.hook,null,'',JSON.stringify({t:'d',path}));
  dirs().push({path,mid:m.id});save();render();log('Created folder '+path);
}
async function renameDir(p){
  const n=clean(prompt('Folder name',base(p)));if(!n||n===base(p))return;
  const np=join(par(p),n),re=x=>inF(x,p)?np+x.slice(p.length):x;
  for(const d of dirs().filter(d=>inF(d.path,p))){d.path=re(d.path);await hf(A.meta.hook,'/messages/'+d.mid,{method:'PATCH',headers:J,body:JSON.stringify({content:JSON.stringify({t:'d',path:d.path})})})}
  for(const f of L().list.filter(f=>(f.folder||[]).some(x=>inF(x,p)))){f.folder=f.folder.map(re);await editMeta(f)}
  if(inF(cur,p))nav(re(cur));save();render();
}
async function removeDir(p){
  if(!confirm('Remove folder "'+base(p)+'"? Nothing is deleted: its files move up to the parent folder.'))return;
  const up=par(p);
  for(const f of L().list.filter(f=>(f.folder||[]).some(x=>inF(x,p)))){f.folder=[...new Set(f.folder.map(x=>inF(x,p)?up:x).filter(Boolean))];await editMeta(f)}
  for(const d of dirs().filter(d=>inF(d.path,p)))await hf(A.meta.hook,'/messages/'+d.mid,{method:'DELETE'});
  L().dirs=dirs().filter(d=>!inF(d.path,p));
  if(inF(cur,p))nav(up);save();render();
}

$('#list').onclick=e=>{

  if(a==='del'&&fs.length&&confirm('Delete '+(fs.length>1?fs.length+' files':'"'+fs[0].name+fs[0].ext+'"')+' forever from Discord? This cannot be undone.'))for(const x of fs)await remove(x);
  if(a==='trash'||a==='rest'){for(const x of fs){x.trash=a==='trash';await editMeta(x)}}
  if(a==='star'){const on=!fs.every(x=>x.star);for(const x of fs){x.star=on;await editMeta(x)}}
  if(a==='renf')await renameDir(p);

});

// preview / streaming: sw.js answers the player's Range requests and pulls only the needed bytes from the right chunk
const MIME={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',avif:'image/avif',bmp:'image/bmp',svg:'image/svg+xml',mp4:'video/mp4',m4v:'video/mp4',mov:'video/quicktime',webm:'video/webm',ogv:'video/ogg',mp3:'audio/mpeg',m4a:'audio/mp4',wav:'audio/wav',ogg:'audio/ogg',flac:'audio/flac',aac:'audio/aac',pdf:'application/pdf'};
const UC=new Map();
async function chunkUrl(f,i){
  const k=f.id+':'+i,c=UC.get(k);
  if(c&&Date.now()-c.t<18e5)return c.u;
  const mid=(await getChunks(f))[i],m=await msgOf(mid);
  let u=m.attachments[0].url;
  const p=(D.proxy||'').trim();
  if(p)u=/[?=]$/.test(p)?p+u:p.replace(/\/?$/,'/')+u;   // streaming always goes through the proxy (direct CDN reads are blocked)
  UC.set(k,{u,t:Date.now()});return u;
}
navigator.serviceWorker?.addEventListener('message',async e=>{
  const d=e.data,port=e.ports[0];if(!port||!A)return;
  try{
    const f=L().list.find(x=>x.id===d.fid);if(!f)throw new Error('File not found in the list');
    if(d.t==='meta')port.postMessage({size:f.size,cs:f.cs||CH,mime:MIME[(f.ext||'').slice(1).toLowerCase()]||'application/octet-stream'});
    if(d.t==='url')port.postMessage({url:await chunkUrl(f,d.i)});
  }catch(err){port.postMessage({error:err.message})}
});
async function swReady(){
  if(!('serviceWorker' in navigator))return false;
  try{
    await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
    if(!navigator.serviceWorker.controller)await new Promise(r=>{navigator.serviceWorker.addEventListener('controllerchange',r,{once:true});setTimeout(r,1500)});
    return!!navigator.serviceWorker.controller;
  }catch(e){log('Streaming helper unavailable: '+e.message);return false}
}
async function blobOf(f,mt){
  const parts=[];
  for(const mid of await getChunks(f)){const m=await hf(A.data.hook,'/messages/'+mid),r=await cdn(m.attachments[0].url);await bad(r);parts.push(await r.arrayBuffer())}
  return new Blob(parts,{type:mt});
}
async function preview(f){
  const mt=MIME[(f.ext||'').slice(1).toLowerCase()],kind=mt.split('/')[0];let src;
  if(await swReady())src=new URL('_drive/'+f.id,location.href).href;
  else if(kind==='image'){toast('sw.js not active, downloading the whole image instead');src=URL.createObjectURL(await blobOf(f,mt))}
  else throw new Error('Video, audio and PDF need sw.js next to this page. Upload it, then reload once.');
  $('#pvt').textContent=f.name+f.ext;
  $('#pvb').innerHTML=kind==='image'?'<img src="'+src+'" alt="">':kind==='video'?'<video src="'+src+'" controls autoplay playsinline></video>':kind==='audio'?'<audio src="'+src+'" controls autoplay></audio>':'<iframe src="'+src+'" style="width:100%;height:70vh;border:0"></iframe>';
  $('#pvd').showModal();
}
$('#pvd').onclose=()=>{$('#pvb').innerHTML=''};  // removing the player cancels its requests

(async()=>{
